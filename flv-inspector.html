<html>

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <div class="navigate">
            <div class="file-input">
                <input type="file" id="file" class="file" onchange="fileLoad()">
                <label for="file">File</label>
            </div>
        </div>

        <div class="tags-window">
            <!-- Statistics Panel -->
            <div class="stats-panel" id="stats-panel">
                <div class="stats-grid">
                    <div class="stats-item"><span class="label">Duration:</span><span class="value" id="stat-duration">-</span></div>
                    <div class="stats-item"><span class="label">Total Tags:</span><span class="value" id="stat-total">-</span></div>
                    <div class="stats-item"><span class="label">Video Tags:</span><span class="value" id="stat-video">-</span></div>
                    <div class="stats-item"><span class="label">Audio Tags:</span><span class="value" id="stat-audio">-</span></div>
                    <div class="stats-item"><span class="label">Keyframes:</span><span class="value" id="stat-keyframes">-</span></div>
                    <div class="stats-item"><span class="label">Resolution:</span><span class="value" id="stat-resolution">-</span></div>
                    <div class="stats-item"><span class="label">Video Codec:</span><span class="value" id="stat-video-codec">-</span></div>
                    <div class="stats-item"><span class="label">Audio Codec:</span><span class="value" id="stat-audio-codec">-</span></div>
                    <div class="stats-item"><span class="label">Video Bitrate:</span><span class="value" id="stat-video-bitrate">-</span></div>
                    <div class="stats-item"><span class="label">Audio Bitrate:</span><span class="value" id="stat-audio-bitrate">-</span></div>
                </div>
            </div>
            <!-- Filter Toolbar -->
            <div class="filter-toolbar">
                <label>Type:</label>
                <select id="filter-type" onchange="applyFilter()">
                    <option value="all">All</option>
                    <option value="video">Video</option>
                    <option value="audio">Audio</option>
                    <option value="script">Script</option>
                </select>
                <label>Frame:</label>
                <select id="filter-frame" onchange="applyFilter()">
                    <option value="all">All</option>
                    <option value="key">Keyframe</option>
                    <option value="inter">Inter Frame</option>
                    <option value="header">Header</option>
                </select>
                <div class="keyframe-nav">
                    <button id="btn-prev-key" onclick="jumpToKeyframe(-1)" title="Previous Keyframe">&lt; Prev Key</button>
                    <button id="btn-next-key" onclick="jumpToKeyframe(1)" title="Next Keyframe">Next Key &gt;</button>
                </div>
            </div>
            <select class="frame-select" id="frame-range" onchange="rangeChange()">
                <option>Frame range</option>
            </select>
            <div class="tags-table">
                <table id="tags-info"></table>
            </div>
        </div>

        <div class="tag-detail">
            <div class="frame-info" id="frame-info"></div>
            <div class="hexdump" id="hexdump"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-2.2.4.min.js" integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>
    <script src="flv-metadata.js" type="text/javascript"></script>
    <script src="flv-parser.js" type="text/javascript"></script>
    <script src="sps-parser.js" type="text/javascript"></script>

    <script>
        const maxHexId = 5000;
        
        // Global state for filtering and selection
        var filterState = {
            type: 'all',      // all, video, audio, script
            frame: 'all',     // all, key, inter, header
            selectedTagIndex: -1,  // Original index in parser.tags
            filteredTags: []  // Array of {originalIndex, tag}
        };

        // Statistics data
        var statsData = {
            duration: 0,
            totalTags: 0,
            videoTags: 0,
            audioTags: 0,
            keyframes: 0,
            keyframeIntervals: [],
            videoBytes: 0,
            audioBytes: 0,
            resolution: null
        };

        function hexdump(data) {
            let lines = [];
            let hexId = 0;
            for (let i = 0; i < data.length; i += 16) {
                let address = i.toString(16).padStart(8, '0');
                let block = data.slice(i, i + 16);
                let hexArray = [];
                let asciiArray = [];
                let padding = [];

                for (let value of block) {
                    hexArray.push(value.toString(16).padStart(2, '0'));
                    // printable ascii charactor exclude '>' and '<'
                    asciiArray.push(value >= 0x20 && value < 0x7f && value != 0x3c && value != 0x3e ? String.fromCharCode(value) : ".");
                }

                if (hexArray.length < 16) {
                    let space = 16 - hexArray.length;
                    padding = ' '.repeat(space * 2 + space + (hexArray.length < 9 ? 1 : 0));
                }

                //let hexString = hexArray.length > 8 ? hexArray.slice(0, 8).join(' ') + '  ' + hexArray.slice(8).join(' ') : hexArray.join(' ');
                let hexString = '';
                for (let i = 0; i < 16; i++) {
                    if (i == 8) {
                        hexString += ' ';
                    }
                    if (i < hexArray.length) {
                        if (hexId < maxHexId) {
                            hexString += '<span hex-id="'+ hexId + '">' + hexArray[i] + '</span>';
                            hexId++;
                        } else {
                            hexString += hexArray[i];
                        }

                        hexString += ' ';
                    }
                }
                // let asciiString = asciiArray.join('');
                let asciiString = '';
                for (let i = 0; i < asciiArray.length; i++) {
                    asciiString += asciiArray[i];
                }
                let line = `${address}  ${hexString}  ${padding}|${asciiString}|`;
                lines.push(line);
            }
            return '<pre id="hexdump-content">' + lines.join('\n') + '</pre>';
        }

        function renderSPS(data, codec) {
            try {
                let info = null;
                if (codec === 'h264') {
                    info = SPSParser.parseH264(data);
                } else if (codec === 'h265') {
                    info = SPSParser.parseH265(data);
                }
                
                if (info) {
                    let spsBox = $("<div class='sps-details-box'></div>");
                    let ul = $("<ul/>");
                    // Put key properties first
                    if (info.width && info.height) {
                         ul.append("<li><b>Resolution: " + info.width + "x" + info.height + "</b></li>");
                    }
                    for (let k in info) {
                        if (k !== 'width' && k !== 'height') {
                            ul.append("<li>" + k + ": " + info[k] + "</li>");
                        }
                    }
                    spsBox.append(ul);
                    return spsBox;
                }
            } catch (e) {
                console.error("SPS Parse Error", e);
                return $("<ul><li>Parse Error: " + e.message + "</li></ul>");
            }
            return null;
        }

        function showFlvHeader(e) {
            console.log("show FLV header");
            $('.selected').removeClass('selected');
            $(this).addClass("selected");
            document.getElementById("hexdump").innerHTML = "";
            document.getElementById("frame-info").innerHTML = "";
            
            // Reset selected tag index (FLV header is not a tag)
            filterState.selectedTagIndex = -1;
            updateKeyframeButtons();
            let headers = $("<ul/>");
            headers.append("<li start-id='3' end-id='3'>Version: " + parser.version + "</li>");
            headers.append("<li start-id='4' end-id='4'>HaveVideo: " + parser.haveVideo + "</li>");
            headers.append("<li start-id='4' end-id='4'>HaveAudio: " + parser.haveAudio + "</li>");
            headers.append("<li start-id='5' end-id='8'>DataOffset: " + parser.dataOffset + "</li>");
            let tagHeader = $("<li start-id='0' end-id='" + 8 + "'><span class='caret'>FLVHeader</span></li>");
            tagHeader.append(headers);
            let tagInfo = $("<ul/>");
            tagInfo.append(tagHeader);
            $("#frame-info").append(tagInfo);
            $("#hexdump").append(hexdump(parser.data.slice(0, 9)));
        }

        function showTagDetail(e) {
            document.getElementById("hexdump").innerHTML = "";
            document.getElementById("frame-info").innerHTML = "";
            
            // Update keyframe buttons
            updateKeyframeButtons();

            let tag = e.data;
            let payload = parser.data.slice(tag.payload_start, tag.end);

            let headers = $("<ul/>");
            headers.append("<li start-id='0' end-id='0'>TagType: " + tag.getTypeName() + "</li>");
            headers.append("<li start-id='1' end-id='3'>DataSize: " + tag.size + "</li>");
            headers.append("<li start-id='4' end-id='7'>Timestamp: " + tag.dts + "</li>");
            headers.append("<li start-id='8' end-id='10'>StreamID: " + 0 + "</li>");
            let hexEndId = tag.size + 11;
            let bodys = $("<ul/>");
            let endId = 10;
            if (tag.type == 8) {
                let audioHdrs = $("<ul/>");
                audioHdrs.append("<li start-id='11' end-id='11'>SoundFormat: " + tag.getCodecName() + "</li>");
                audioHdrs.append("<li start-id='11' end-id='11'>SoundRate: " + tag.getSoundRateText() + "</li>");
                audioHdrs.append("<li start-id='11' end-id='11'>SoundSize: " + tag.getSoundSizeText() + "</li>");
                audioHdrs.append("<li start-id='11' end-id='11'>SoundType: " + tag.getSoundTypeText() + "</li>");
                endId = 11;
                if (tag.soundFormat == 10) {
                    audioHdrs.append("<li start-id='12' end-id='12'>AACPacketType: " + tag.aacPacketType + "</li>");
                    endId = 12;
                }
                let audioHeader = $("<li start-id='11' end-id='" + endId + "'><span class='caret'>AudioTagHeader</span></li>");
                audioHeader.append(audioHdrs);
                headers.append(audioHeader);
            } else if (tag.type == 9) {
                let videoHdrs = $("<ul/>");
                videoHdrs.append("<li start-id='11' end-id='11'>Frame: " + tag.getFrameTypeText() + "</li>");
                videoHdrs.append("<li start-id='11' end-id='11'>Codec: " + tag.getCodecName() + "</li>");
                endId = 11;
                if (tag.codecId == 7 || tag.codecId == 12) {
                    videoHdrs.append("<li start-id='12' end-id='12'>AVCPacketType: " + tag.avcPacketType + "</li>");
                    videoHdrs.append("<li start-id='13' end-id='15'>CTS: " + tag.cts+ "</li>");
                    endId = 15;
                }
                let videoHeader = $("<li start-id='11' end-id='" + endId + "'><span class='caret'>VideoTagHeader</span></li>");
                videoHeader.append(videoHdrs);
                headers.append(videoHeader);
            } else if (tag.type == 18) {
                const metadata = parseMetadata(String.fromCharCode.apply(null, payload));
                let metadataWrap = $("<li><span class='caret'>Metadata</span></li>")
                let metadatas = $("<ul/>")
                for (let k in metadata) {
                    metadatas.append("<li>" + k + ": " + metadata[k] + "</li>");
                }
                metadataWrap.append(metadatas);
                bodys.append(metadataWrap);
            }

            let tagHeader = $("<li start-id='0' end-id='" + endId + "'><span class='caret'>TagHeader</span></li>");
            tagHeader.append(headers);
            let tagInfo = $("<ul/>");
            let tagBody = $("<li><span class='caret'>Data</span></li>");
            tagInfo.append(tagHeader);
            tagInfo.append(tagBody);

            $("#frame-info").append(tagInfo);
            if (tag.codecId == 7) { // H.264
                if (tag.avcPacketType == 0) {
                    // Parse AVCDecoderConfigurationRecord
                    let configurationVersion = payload[0];
                    let AVCProfileIndication = payload[1];
                    let profile_compatibility = payload[2];
                    let AVCLevelIndication = payload[3];
                    let lengthSizeMinusOne = payload[4] & 0x02;
                    let numOfSequenceParameterSets = payload[5] & 0x1f;
                    bodys.append("<li start-id='16' end-id='16'>configurationVersion: " + configurationVersion + "</li>");
                    bodys.append("<li start-id='17' end-id='17'>AVCProfileIndication: " + AVCProfileIndication + "</li>");
                    bodys.append("<li start-id='18' end-id='18'>profile_compatibility: " + profile_compatibility + "</li>");
                    bodys.append("<li start-id='19' end-id='19'>AVCLevelIndication: " + AVCLevelIndication + "</li>");
                    bodys.append("<li start-id='20' end-id='20'>lengthSizeMinusOne: " + lengthSizeMinusOne + "</li>");
                    bodys.append("<li start-id='21' end-id='21'>numOfSequenceParameterSets: " + numOfSequenceParameterSets + "</li>");
                    let pos = 6;
                    for (let i = 0; i < numOfSequenceParameterSets; i++) {
                        let sequenceParameterSetLength = payload[pos] << 8 | payload[pos + 1];
                        bodys.append("<li start-id=" + (16 + pos) + " end-id=" + (16 + pos + 1) + ">sequenceParameterSetLength: " + sequenceParameterSetLength + "</li>");
                        
                        let spsLi = $("<li start-id=" + (16 + pos + 2) + " end-id=" + (16 + pos + 1 + sequenceParameterSetLength) + ">SPS</li>");
                        let spsDetails = renderSPS(payload.slice(pos + 2, pos + 2 + sequenceParameterSetLength), 'h264');
                        if (spsDetails) spsLi.append(spsDetails);
                        bodys.append(spsLi);
                        
                        pos += 2 + sequenceParameterSetLength;

                    }
                    let numOfPictureParameterSets = payload[pos];
                    bodys.append("<li start-id=" + (16 + pos) + " end-id=" + (16 + pos) + ">numOfPictureParameterSets: " + numOfPictureParameterSets + "</li>");
                    pos++;
                    for (let i = 0; i < numOfPictureParameterSets; i++) {
                        let pictureParameterSetLength = payload[pos] << 8 | payload[pos + 1];
                        bodys.append("<li start-id=" + (16 + pos) + " end-id=" + (16 + pos + 1) + ">pictureParameterSetLength: " + pictureParameterSetLength + "</li>");
                        bodys.append("<li start-id=" + (16 + pos + 2) + " end-id=" + (16 + pos + 1 + pictureParameterSetLength) + ">PPS</li>");
                        pos += 2 + pictureParameterSetLength;
                    }
                } else if (tag.avcPacketType == 1) {
                    for (let i = 0; i < payload.length;) {
                        let nalu_len = payload[i] << 24 | payload[i + 1] << 16 | payload[i + 2] << 8 | payload[i + 3];
                        if (nalu_len <= 0 || i + 4 + nalu_len > payload.length) {
                            break;
                        }
                        let nalu_type;
                        switch (payload[i + 4] & 0x1f) {
                            case 1:
                                nalu_type = "Slice";
                                break;
                            case 5:
                                nalu_type = "IDR";
                                break;
                            case 6:
                                nalu_type = "SEI";
                                break;
                            case 7:
                                nalu_type = "SPS";
                                break;
                            case 8:
                                nalu_type = "PPS";
                                break;
                            case 9:
                                nalu_type = "AUD";
                                break;
                            default:
                                nalu_type = payload[i + 4] & 0x1f;
                        }
                        let start_id = tag.payload_start - tag.start + i;
                        let end_id = tag.payload_start - tag.start + i + nalu_len + 3;
                        let naluLi = $("<li start-id=" + start_id + " end-id=" + end_id + ">NALU: " + nalu_type + "</li>");
                        if (nalu_type === "SPS") {
                             let spsDetails = renderSPS(payload.slice(i + 4, i + 4 + nalu_len), 'h264');
                             if (spsDetails) naluLi.append(spsDetails);
                        }
                        bodys.append(naluLi);
                        i += nalu_len + 4;
                    }
                }
            } else if (tag.codecId == 12) { // H.265
                if (tag.avcPacketType == 0) {
                    // Parse HEVCDecoderConfigurationRecord
                    let configurationVersion = payload[0];
                    let general_profile_space = (payload[1] >> 6) & 0x03;
                    let general_tier_flag = (payload[1] >> 5) & 0x01;
                    let general_profile_idc = payload[1] & 0x1f;
                    bodys.append("<li start-id='16' end-id='16'>configurationVersion: " + configurationVersion + "</li>");
                    bodys.append("<li start-id='17' end-id='17'>general_profile_space: " + general_profile_space + "</li>");
                    bodys.append("<li start-id='17' end-id='17'>general_tier_flag: " + general_tier_flag + "</li>");
                    bodys.append("<li start-id='17' end-id='17'>general_profile_idc: " + general_profile_idc + "</li>");
                    
                    let pos = 22; // Skip fixed fields, start from numOfArrays
                    if (pos < payload.length) {
                        let numOfArrays = payload[pos];
                        bodys.append("<li start-id='" + (16 + pos) + "' end-id='" + (16 + pos) + "'>numOfArrays: " + numOfArrays + "</li>");
                        pos++;
                        
                        for (let i = 0; i < numOfArrays; i++) {
                            if (pos + 2 >= payload.length) break;
                            let array_completeness = (payload[pos] >> 7) & 0x01;
                            let NAL_unit_type = payload[pos] & 0x3f;
                            let numNalus = (payload[pos + 1] << 8) | payload[pos + 2];
                            let nalType = "";
                            switch (NAL_unit_type) {
                                case 32: nalType = "VPS"; break;
                                case 33: nalType = "SPS"; break;
                                case 34: nalType = "PPS"; break;
                                default: nalType = "Type" + NAL_unit_type;
                            }
                            bodys.append("<li start-id='" + (16 + pos) + "' end-id='" + (16 + pos + 2) + "'>" + nalType + " numNalus: " + numNalus + "</li>");
                            pos += 3;
                            
                            for (let j = 0; j < numNalus; j++) {
                                if (pos + 1 >= payload.length) break;
                                let nalUnitLength = (payload[pos] << 8) | payload[pos + 1];
                                                            bodys.append("<li start-id='" + (16 + pos) + "' end-id='" + (16 + pos + 1) + "'>nalUnitLength: " + nalUnitLength + "</li>");
                                                            let nalLi = $("<li start-id='" + (16 + pos + 2) + "' end-id='" + (16 + pos + 1 + nalUnitLength) + "'>" + nalType + "</li>");
                                                            if (nalType === "SPS") {
                                                                let spsDetails = renderSPS(payload.slice(pos + 2, pos + 2 + nalUnitLength), 'h265');
                                                                if (spsDetails) nalLi.append(spsDetails);
                                                            }
                                                            bodys.append(nalLi);
                                                            pos += 2 + nalUnitLength;                            }
                        }
                    }
                } else if (tag.avcPacketType == 1) {
                    for (let i = 0; i < payload.length;) {
                        let nalu_len = payload[i] << 24 | payload[i + 1] << 16 | payload[i + 2] << 8 | payload[i + 3];
                        if (nalu_len <= 0 || i + 4 + nalu_len > payload.length) {
                            break;
                        }
                        let nalu_type;
                        let nalu_type_val = (payload[i + 4] >> 1) & 0x3f;
                        switch (nalu_type_val) {
                            case 0:
                            case 1:
                                nalu_type = "Slice";
                                break;
                            case 16:
                            case 17:
                            case 18:
                                nalu_type = "BLA";
                                break;
                            case 19:
                            case 20:
                            case 21:
                                nalu_type = "IDR";
                                break;
                            case 32:
                                nalu_type = "VPS";
                                break;
                            case 33:
                                nalu_type = "SPS";
                                break;
                            case 34:
                                nalu_type = "PPS";
                                break;
                            case 35:
                                nalu_type = "AUD";
                                break;
                            case 39:
                            case 40:
                                nalu_type = "SEI";
                                break;
                            default:
                                nalu_type = nalu_type_val;
                        }
                        let start_id = tag.payload_start - tag.start + i;
                        let end_id = tag.payload_start - tag.start + i + nalu_len + 3;
                        let naluLi = $("<li start-id=" + start_id + " end-id=" + end_id + ">NALU: " + nalu_type + "</li>");
                        if (nalu_type === "SPS") {
                             let spsDetails = renderSPS(payload.slice(i + 4, i + 4 + nalu_len), 'h265');
                             if (spsDetails) naluLi.append(spsDetails);
                        }
                        bodys.append(naluLi);
                        i += nalu_len + 4;
                    }
                }
            }
            tagBody.append(bodys);

            $("#hexdump").append(hexdump(parser.data.slice(tag.start, tag.end)));
        }

        const max_range = 1000;

        // Filter tags based on current filter state
        function getFilteredTags() {
            if (!parser || !parser.tags) return [];
            
            let filtered = [];
            for (let i = 0; i < parser.tags.length; i++) {
                let tag = parser.tags[i];
                
                // Type filter
                if (filterState.type !== 'all') {
                    if (filterState.type === 'video' && tag.type !== 9) continue;
                    if (filterState.type === 'audio' && tag.type !== 8) continue;
                    if (filterState.type === 'script' && tag.type !== 18) continue;
                }
                
                // Frame filter
                if (filterState.frame !== 'all') {
                    if (filterState.frame === 'key') {
                        // Only video keyframes
                        if (tag.type !== 9 || tag.frameType !== 1) continue;
                    } else if (filterState.frame === 'inter') {
                        // Only video inter frames
                        if (tag.type !== 9 || tag.frameType !== 2) continue;
                    } else if (filterState.frame === 'header') {
                        // Only header packets (AVC/HEVC sequence header or AAC config)
                        let isHeader = false;
                        if (tag.type === 9 && (tag.codecId === 7 || tag.codecId === 12) && tag.avcPacketType === 0) {
                            isHeader = true;
                        }
                        if (tag.type === 8 && tag.soundFormat === 10 && tag.aacPacketType === 0) {
                            isHeader = true;
                        }
                        if (!isHeader) continue;
                    }
                }
                
                filtered.push({ originalIndex: i, tag: tag });
            }
            return filtered;
        }

        // Apply filter and refresh display
        function applyFilter() {
            filterState.type = $("#filter-type").val();
            filterState.frame = $("#filter-frame").val();
            filterState.filteredTags = getFilteredTags();
            
            // Update range selector
            updateRangeSelector();
            
            // Show first range, try to keep selected tag visible
            let targetPage = 0;
            if (filterState.selectedTagIndex >= 0) {
                // Find if selected tag is in filtered results
                for (let i = 0; i < filterState.filteredTags.length; i++) {
                    if (filterState.filteredTags[i].originalIndex === filterState.selectedTagIndex) {
                        targetPage = Math.floor(i / max_range) * max_range;
                        break;
                    }
                }
            }
            
            $("#frame-range").val(targetPage);
            let end = Math.min(targetPage + max_range, filterState.filteredTags.length);
            showFilteredRange(targetPage, end);
        }

        // Update range selector based on filtered tags
        function updateRangeSelector() {
            $("#frame-range").empty();
            let total = filterState.filteredTags.length;
            
            if (total === 0) {
                $("#frame-range").append($("<option value=0>No matching tags</option>"));
                return;
            }
            
            for (let i = 0; i < total; i += max_range) {
                let start = i + 1;
                let end = Math.min(i + max_range, total);
                $("#frame-range").append($("<option value=" + i + "> No. " + start + "~" + end + " (of " + total + ")</option>"));
            }
        }

        // Get tag row CSS class based on type
        function getTagTypeClass(tag) {
            switch (tag.type) {
                case 9: return 'tag-video';
                case 8: return 'tag-audio';
                case 18: return 'tag-script';
                default: return '';
            }
        }

        // show filtered range [start : end)
        function showFilteredRange(start, end) {
            document.getElementById("frame-info").innerHTML = "";
            document.getElementById("tags-info").innerHTML = "";
            document.getElementById("hexdump").innerHTML = "";

            let tableHeader = $("<thead></thead>");
            let tableRow = $("<tr></tr>");
            tableRow.append($("<th>No.</th><th>Type</th><th>Codec</th><th>DTS</th><th>PTS</th><th>Size</th><th>Frame</th>"));
            tableHeader.append(tableRow);
            $("#tags-info").append(tableHeader);
            
            // Show FLV header only on first page with no filter
            if (start == 0 && filterState.type === 'all' && filterState.frame === 'all') {
                let tableBody = $("<tbody></tbody>");
                let tableRow = $("<tr></tr>");
                tableRow.append("<td>0</td><td>-</td><td>-</td><td>-</td><td>-</td><td>9</td><td>FLV Header</td>");
                tableRow.click(parser, showFlvHeader);
                tableBody.append(tableRow);
                $("#tags-info").append(tableBody);
            }
            
            for (let i = start; i < end && i < filterState.filteredTags.length; i++) {
                let item = filterState.filteredTags[i];
                let tag = item.tag;
                let originalIndex = item.originalIndex;
                
                let frameType = "";
                if (tag.type == 9 && tag.frameType == 1) {
                    frameType = "Key";
                    if (tag.avcPacketType == 0) {
                        frameType += ", Header";
                    }
                } else if (tag.type == 8) {
                    if (tag.soundFormat == 10 && tag.aacPacketType == 0) {
                        frameType = "Header";
                    }
                }
                
                let tableBody = $("<tbody></tbody>");
                let tableRow = $("<tr></tr>");
                let typeClass = getTagTypeClass(tag);
                if (typeClass) tableRow.addClass(typeClass);
                
                // Highlight if this is the selected tag
                if (originalIndex === filterState.selectedTagIndex) {
                    tableRow.addClass("selected");
                }
                
                let num = originalIndex + 1;
                tableRow.append("<td>" + num + "</td><td>" + tag.getTypeName() + "</td><td>" + tag.getCodecName() + "</td><td>" + tag.dts + "</td><td>" + tag.pts + "</td><td>" + tag.size + "</td><td>" + frameType + "</td>");
                tableRow.attr("data-original-index", originalIndex);
                tableRow.click(tag, function(e) {
                    filterState.selectedTagIndex = parseInt($(this).attr("data-original-index"));
                    // Remove selected from all rows and add to clicked row
                    $('.selected').removeClass('selected');
                    $(this).addClass("selected");
                    showTagDetail(e);
                });
                tableBody.append(tableRow);
                $("#tags-info").append(tableBody);
            }
            
            updateKeyframeButtons();
        }

        // show range [start : end) - legacy function, now uses filtered version
        function showRange(start, end) {
            filterState.filteredTags = getFilteredTags();
            updateRangeSelector();
            let filteredEnd = Math.min(start + max_range, filterState.filteredTags.length);
            showFilteredRange(start, filteredEnd);
        }

        function rangeChange() {
            let start = parseInt($("#frame-range option:selected").val());
            let end = Math.min(start + max_range, filterState.filteredTags.length);
            showFilteredRange(start, end);
        }

        // Jump to next/previous keyframe
        function jumpToKeyframe(direction) {
            if (!parser || !parser.tags) return;
            
            let currentIndex = filterState.selectedTagIndex;
            let startSearch = currentIndex >= 0 ? currentIndex + direction : (direction > 0 ? 0 : parser.tags.length - 1);
            
            // Find next/previous keyframe in original tags array
            let keyframeIndex = -1;
            if (direction > 0) {
                for (let i = startSearch; i < parser.tags.length; i++) {
                    let tag = parser.tags[i];
                    if (tag.type === 9 && tag.frameType === 1) {
                        keyframeIndex = i;
                        break;
                    }
                }
            } else {
                for (let i = startSearch; i >= 0; i--) {
                    let tag = parser.tags[i];
                    if (tag.type === 9 && tag.frameType === 1) {
                        keyframeIndex = i;
                        break;
                    }
                }
            }
            
            if (keyframeIndex < 0) {
                showToast(direction > 0 ? "No more keyframes" : "No previous keyframe");
                return;
            }
            
            // Update selection
            filterState.selectedTagIndex = keyframeIndex;
            
            // Find this keyframe in filtered list
            let filteredIndex = -1;
            for (let i = 0; i < filterState.filteredTags.length; i++) {
                if (filterState.filteredTags[i].originalIndex === keyframeIndex) {
                    filteredIndex = i;
                    break;
                }
            }
            
            if (filteredIndex >= 0) {
                // Keyframe is visible in current filter, navigate to its page
                let targetPage = Math.floor(filteredIndex / max_range) * max_range;
                $("#frame-range").val(targetPage);
                let end = Math.min(targetPage + max_range, filterState.filteredTags.length);
                showFilteredRange(targetPage, end);
                
                // Scroll to and highlight the row
                setTimeout(function() {
                    let row = $("tr[data-original-index='" + keyframeIndex + "']");
                    if (row.length) {
                        row[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        row.click();
                    }
                }, 50);
            } else {
                // Keyframe not in current filter, temporarily show all and navigate
                $("#filter-type").val('all');
                $("#filter-frame").val('all');
                applyFilter();
                
                // Find again in unfiltered list
                for (let i = 0; i < filterState.filteredTags.length; i++) {
                    if (filterState.filteredTags[i].originalIndex === keyframeIndex) {
                        filteredIndex = i;
                        break;
                    }
                }
                
                let targetPage = Math.floor(filteredIndex / max_range) * max_range;
                $("#frame-range").val(targetPage);
                let end = Math.min(targetPage + max_range, filterState.filteredTags.length);
                showFilteredRange(targetPage, end);
                
                setTimeout(function() {
                    let row = $("tr[data-original-index='" + keyframeIndex + "']");
                    if (row.length) {
                        row[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                        row.click();
                    }
                }, 50);
                
                showToast("Filter reset to show keyframe");
            }
        }

        // Update keyframe navigation button states
        function updateKeyframeButtons() {
            if (!parser || !parser.tags) {
                $("#btn-prev-key, #btn-next-key").prop("disabled", true);
                return;
            }
            
            let currentIndex = filterState.selectedTagIndex;
            
            // Check if there's a previous keyframe
            let hasPrev = false;
            for (let i = currentIndex - 1; i >= 0; i--) {
                if (parser.tags[i].type === 9 && parser.tags[i].frameType === 1) {
                    hasPrev = true;
                    break;
                }
            }
            
            // Check if there's a next keyframe
            let hasNext = false;
            for (let i = currentIndex + 1; i < parser.tags.length; i++) {
                if (parser.tags[i].type === 9 && parser.tags[i].frameType === 1) {
                    hasNext = true;
                    break;
                }
            }
            
            $("#btn-prev-key").prop("disabled", !hasPrev);
            $("#btn-next-key").prop("disabled", !hasNext);
        }

        // Calculate and display statistics
        function calculateStats() {
            if (!parser || !parser.tags || parser.tags.length === 0) return;
            
            statsData = {
                duration: 0,
                totalTags: parser.tags.length,
                videoTags: 0,
                audioTags: 0,
                keyframes: 0,
                videoBytes: 0,
                audioBytes: 0,
                resolution: null,
                videoCodec: null,
                audioCodec: null
            };
            
            let mediaDtsList = [];
            
            for (let i = 0; i < parser.tags.length; i++) {
                let tag = parser.tags[i];
                
                if (tag.type === 9) {
                    // Video tag
                    statsData.videoTags++;
                    statsData.videoBytes += tag.size;
                    
                    // Get video codec from first video tag
                    if (!statsData.videoCodec) {
                        statsData.videoCodec = tag.getCodecName();
                    }
                    
                    // Only use actual media data for duration (exclude sequence headers)
                    let isSequenceHeader = (tag.codecId === 7 || tag.codecId === 12) && tag.avcPacketType === 0;
                    if (!isSequenceHeader) {
                        mediaDtsList.push(tag.dts);
                    }
                    
                    if (tag.frameType === 1) {
                        statsData.keyframes++;
                    }
                } else if (tag.type === 8) {
                    // Audio tag
                    statsData.audioTags++;
                    statsData.audioBytes += tag.size;
                    
                    // Get audio codec from first audio tag
                    if (!statsData.audioCodec) {
                        statsData.audioCodec = tag.getCodecName();
                    }
                    
                    // Only use actual media data for duration (exclude AAC config)
                    let isAudioConfig = tag.soundFormat === 10 && tag.aacPacketType === 0;
                    if (!isAudioConfig) {
                        mediaDtsList.push(tag.dts);
                    }
                } else if (tag.type === 18) {
                    // Script tag - try to get resolution from metadata
                    try {
                        let payload = parser.data.slice(tag.payload_start, tag.end);
                        let metadata = parseMetadata(String.fromCharCode.apply(null, payload));
                        if (metadata && metadata.width && metadata.height) {
                            statsData.resolution = metadata.width + "x" + metadata.height;
                        }
                    } catch (e) {}
                }
            }
            
            // Calculate duration from media DTS values
            if (mediaDtsList.length > 0) {
                mediaDtsList.sort((a, b) => a - b);
                let minDts = mediaDtsList[0];
                let maxDts = mediaDtsList[mediaDtsList.length - 1];
                statsData.duration = maxDts - minDts;
            }
            
            // Update UI
            $("#stat-duration").text(formatDuration(statsData.duration));
            $("#stat-total").text(statsData.totalTags);
            $("#stat-video").text(statsData.videoTags);
            $("#stat-audio").text(statsData.audioTags);
            $("#stat-keyframes").text(statsData.keyframes);
            $("#stat-video-codec").text(statsData.videoCodec || "-");
            $("#stat-audio-codec").text(statsData.audioCodec || "-");
            
            // Calculate bitrates
            if (statsData.duration > 0) {
                let videoBitrate = (statsData.videoBytes * 8) / (statsData.duration / 1000) / 1000;
                let audioBitrate = (statsData.audioBytes * 8) / (statsData.duration / 1000) / 1000;
                $("#stat-video-bitrate").text(videoBitrate.toFixed(0) + " kbps");
                $("#stat-audio-bitrate").text(audioBitrate.toFixed(0) + " kbps");
            } else {
                $("#stat-video-bitrate").text("-");
                $("#stat-audio-bitrate").text("-");
            }
            
            $("#stat-resolution").text(statsData.resolution || "-");
            
            // Show stats panel
            $("#stats-panel").addClass("visible");
        }

        // Format duration in ms to readable string
        function formatDuration(ms) {
            if (ms <= 0) return "-";
            let seconds = Math.floor(ms / 1000);
            let minutes = Math.floor(seconds / 60);
            let hours = Math.floor(minutes / 60);
            
            seconds = seconds % 60;
            minutes = minutes % 60;
            
            if (hours > 0) {
                return hours + "h " + minutes + "m " + seconds + "s";
            } else if (minutes > 0) {
                return minutes + "m " + seconds + "s";
            } else {
                return seconds + "s " + (ms % 1000) + "ms";
            }
        }

        function flvParseDone() {
            if (parser.errorMsg) {
                alert(parser.errorMsg)
                $("#frame-range").empty();
                $("#stats-panel").removeClass("visible");
                return
            }
            
            // Reset filter state
            filterState = {
                type: 'all',
                frame: 'all',
                selectedTagIndex: -1,
                filteredTags: []
            };
            $("#filter-type").val('all');
            $("#filter-frame").val('all');
            
            // Calculate and display statistics
            calculateStats();
            
            // Initialize filtered tags
            filterState.filteredTags = getFilteredTags();
            updateRangeSelector();

            // Show first range
            let first_range = filterState.filteredTags.length > max_range ? max_range : filterState.filteredTags.length;
            showFilteredRange(0, first_range);
        }
    </script>

    <script>
        var parser;

        function parse(file) {
            $("#tags-info").empty();
            $("#frame-info").empty();
            $("#hexdump").empty();
            $("#frame-range").html("<option> Loading... </option>");

            let offset = 0;
            let reader = new FileReader;
            reader.onload = function (e) {
                let buffer = reader.result;
                parser = new FlvParser;
                parser.parseDone = flvParseDone;
                parser.parseData(new Uint8Array(buffer));
            }
            reader.readAsArrayBuffer(file);
        }

        function fileLoad(e) {
            let files = document.getElementById("file").files;
            if (files.length == 0) {
                $("#frame-range").empty();
                alert("File not found");
                return;
            }
            parse(files[0]);
        }
    </script>

    <script>
        $(function() {
            $("#frame-info").on("click", "[start-id]", function(e) {
                $("[hex-id]").removeClass("hex-selected");
                $("[start-id]").removeClass("selected");
                let start = parseInt($(this).attr("start-id"));
                let end = parseInt($(this).attr("end-id"));
                $(this).addClass("selected");
                const HIGHLIGHT_LIMIT = 200;
                const SHORT_HIGHLIGHT = 10;
                if (end - start + 1 > HIGHLIGHT_LIMIT) {
                    // 只高亮前10字节
                    for (let i = start; i < start + SHORT_HIGHLIGHT && i <= end; i++) {
                        $("[hex-id=" + i + "]").addClass("hex-selected");
                    }
                    // 自动滚动到第一个字节
                    let firstHex = $("[hex-id=" + start + "]");
                    if (firstHex.length) {
                        let container = $("#hexdump");
                        let offset = firstHex.offset().top - container.offset().top + container.scrollTop();
                        container.animate({scrollTop: offset - 40}, 200); // 适当留点空间
                    }
                    // 显示提示
                    showToast("该数据段过大，仅高亮前10字节并自动定位");
                } else {
                    for (let i = start; i <= end; i++) {
                        $("[hex-id=" + i + "]").addClass("hex-selected");
                    }
                }
                e.stopPropagation();
            })
        })
        // Toast提示实现
        function showToast(msg) {
            let toast = $("<div class='toast'></div>").text(msg);
            toast.css({
                position: 'fixed',
                left: '50%',
                top: '20%',
                transform: 'translate(-50%, 0)',
                background: 'rgba(0,0,0,0.8)',
                color: '#fff',
                padding: '12px 32px',
                borderRadius: '8px',
                zIndex: 9999,
                fontSize: '18px',
                boxShadow: '0 2px 8px rgba(0,0,0,0.2)'
            });
            $("body").append(toast);
            setTimeout(function(){ toast.fadeOut(400, function(){ toast.remove(); }); }, 1800);
        }
    </script>
